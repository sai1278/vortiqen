global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "vortiqen-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "vortiqen-frontend"
    metrics_path: "/"
    static_configs:
      - targets: ["frontend:8080"]
